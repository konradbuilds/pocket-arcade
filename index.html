<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pocket Arcade">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Pocket Arcade</title>
  <style>
    :root{
      --bg:#111318;--panel:#191d24;--panel2:#222832;--ink:#f7f4eb;--muted:#9da6b4;
      --orange:#ff9d3d;--pink:#ff5e8a;--mint:#67e0c0;--blue:#75b7ff;--purple:#9b7cff;
      --line:#303845
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
      font-family:ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      overscroll-behavior:none}
    body{min-height:100dvh;overflow:hidden}
    button{font:inherit}
    .app{height:100dvh;display:flex;flex-direction:column}
    .top{
      height:58px;display:flex;align-items:center;justify-content:space-between;
      padding:env(safe-area-inset-top) 16px 0;
      border-bottom:1px solid rgba(255,255,255,.05);background:#111318;z-index:20
    }
    .brand{font-weight:950;letter-spacing:-.045em;font-size:20px}.brand span{color:var(--orange)}
    .top-actions{display:flex;gap:8px}
    .icon-btn,.ghost,.primary{border:0;border-radius:18px;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .icon-btn{width:40px;height:40px;background:var(--panel2);color:var(--ink);font-size:18px}
    .screen{flex:1;min-height:0;position:relative}
    .menu{height:100%;overflow:auto;padding:18px 16px calc(24px + env(safe-area-inset-bottom))}
    .hero{
      padding:24px 20px 18px;border-radius:30px;
      background:linear-gradient(145deg,#20252e,#171b22);
      margin-bottom:16px;border:1px solid rgba(255,255,255,.05)
    }
    .hero:before{content:"";display:block;width:54px;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--orange),var(--mint));margin-bottom:14px}
    .kicker{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:var(--orange);font-weight:850}
    h1{font-size:38px;line-height:.95;letter-spacing:-.06em;margin:10px 0 12px;max-width:9ch}
    .hero p{margin:0;color:var(--muted);line-height:1.45;font-size:15px;max-width:36rem}
    .games{display:grid;gap:12px}
    .game-card{
      position:relative;overflow:hidden;text-align:left;width:100%;padding:19px;
      border:1px solid var(--line);border-radius:28px;background:var(--panel);color:var(--ink)
    }
    .game-card:active{transform:scale(.99)}
    .game-card .num{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:850}
    .game-card h2{margin:4px 0 5px;font-size:29px;letter-spacing:-.05em}
    .game-card p{margin:0;color:var(--muted);font-size:14px;line-height:1.35;max-width:75%}
    .orb{position:absolute;width:96px;height:96px;border-radius:34px;right:-18px;top:50%;transform:translateY(-50%) rotate(12deg)}
    .racer .orb{background:linear-gradient(145deg,var(--orange),#ffd95f)}
    .balance .orb{background:linear-gradient(145deg,var(--mint),#b7ffe9)}
    .footer-note{margin:16px 2px 0;color:#6f7884;font-size:12px;text-align:center}

    .game{height:100%;display:none;flex-direction:column;background:#0f1217}.game.active{display:flex}
    .hud{min-height:60px;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.06);background:#111318;z-index:4}
    .hud .back{width:42px;height:42px}
    .hud-copy{min-width:0;flex:1}
    .hud-title{font-weight:950;letter-spacing:-.03em}
    .hud-sub{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .score{text-align:right;font-variant-numeric:tabular-nums;min-width:86px}
    .score b{display:block;font-size:28px;line-height:.95}
    .score span{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
    .canvas-wrap{position:relative;flex:1;min-height:0;touch-action:none}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(10,12,16,.68);z-index:5}
    .overlay.hidden{display:none}
    .sheet{width:min(420px,100%);border:1px solid var(--line);border-radius:30px;padding:22px;background:#171b22}
    .sheet h3{margin:0 0 7px;font-size:29px;letter-spacing:-.05em}
    .sheet p{margin:0 0 16px;color:var(--muted);line-height:1.42;font-size:14px}
    .actions{display:flex;gap:10px;flex-wrap:wrap}
    .primary,.ghost{padding:13px 16px;font-weight:850}
    .primary{background:var(--orange);color:#1b1108}
    .ghost{background:var(--panel2);color:var(--ink)}
    .tiny{font-size:11px;color:#78818d;margin-top:12px}
    .toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%) translateY(10px);
      background:#f5f0e7;color:#181818;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:850;
      opacity:0;pointer-events:none;transition:.2s;z-index:9;white-space:nowrap}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    @media(min-width:700px){
      .menu{max-width:720px;margin:auto;width:100%;padding-top:28px}
      .games{grid-template-columns:repeat(2,1fr)}
      .game-card{min-height:220px}.game-card p{max-width:100%}
      .orb{top:auto;bottom:-28px;right:-10px;transform:rotate(12deg)}
    }
  </style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Pocket <span>Arcade</span></div>
    <div class="top-actions">
      <button class="icon-btn" id="soundBtn" aria-label="Toggle sound">♪</button>
      <button class="icon-btn" id="motionBtn" aria-label="Enable motion">↻</button>
    </div>
  </header>

  <main class="screen">
    <section class="menu" id="menu">
      <div class="hero">
        <div class="kicker">2 tiny phone games</div>
        <h1>Tilt. Cruise. Balance.</h1>
        <p>Simple phone-first games. Easy to pick up, hard to stop fiddling with.</p>
      </div>

      <div class="games">
        <button class="game-card racer" data-game="racer">
          <div class="num">01 · Tilt cruiser</div>
          <h2>TILT RACER</h2>
          <p>A bright, forgiving little road trip. Clean driving gradually gets quicker.</p>
          <span class="orb"></span>
        </button>

        <button class="game-card balance" data-game="balance">
          <div class="num">02 · Precision puzzle</div>
          <h2>BALANCE</h2>
          <p>Tilt sleepy blobs into their beds. Calm hands beat fast hands.</p>
          <span class="orb"></span>
        </button>
      </div>
      <div class="footer-note">Best on a phone · portrait · installable from your browser</div>
    </section>

    <section class="game" id="game">
      <div class="hud">
        <button class="icon-btn back" id="backBtn" aria-label="Back">←</button>
        <div class="hud-copy">
          <div class="hud-title" id="hudTitle"></div>
          <div class="hud-sub" id="hudSub"></div>
        </div>
        <div class="score"><b id="score">0</b><span id="scoreLabel">score</span></div>
      </div>

      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="gameCanvas"></canvas>

        <div class="overlay" id="introOverlay">
          <div class="sheet">
            <h3 id="introTitle"></h3>
            <p id="introText"></p>
            <div class="actions">
              <button class="primary" id="playBtn">Play</button>
              <button class="ghost" id="motionRequestBtn">Enable motion</button>
            </div>
            <div class="tiny" id="introTiny"></div>
          </div>
        </div>

        <div class="overlay hidden" id="endOverlay">
          <div class="sheet">
            <h3 id="endTitle">Nice.</h3>
            <p id="endText"></p>
            <div class="actions">
              <button class="primary" id="againBtn">Again</button>
              <button class="ghost" id="menuBtn">Game menu</button>
            </div>
          </div>
        </div>

        <div class="toast" id="toast">Motion enabled</div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  'use strict';

  const $=s=>document.querySelector(s);
  const menu=$('#menu'),gameEl=$('#game'),canvas=$('#gameCanvas'),ctx=canvas.getContext('2d',{alpha:false}),wrap=$('#canvasWrap');
  const introOverlay=$('#introOverlay'),endOverlay=$('#endOverlay'),scoreEl=$('#score'),scoreLabel=$('#scoreLabel');
  const hudTitle=$('#hudTitle'),hudSub=$('#hudSub'),introTitle=$('#introTitle'),introText=$('#introText'),introTiny=$('#introTiny');
  const endTitle=$('#endTitle'),endText=$('#endText'),motionRequestBtn=$('#motionRequestBtn'),soundBtn=$('#soundBtn');

  let current=null,running=false,raf=0,last=0,W=1,H=1,DPR=1;
  let soundOn=true,motionEnabled=false,tiltX=0,keyX=0,keyY=0;
  let dragging=false,pointer={x:0,y:0,sx:0,sy:0,lastX:0,lastY:0};
  let audioCtx=null,musicTimer=null,musicStep=0,state={};

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,t)=>a+(b-a)*t;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);

  function resize(){
    const r=wrap.getBoundingClientRect();
    W=Math.max(1,Math.floor(r.width));H=Math.max(1,Math.floor(r.height));
    DPR=Math.min(1.5,window.devicePixelRatio||1); // performance first on phones
    canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  new ResizeObserver(resize).observe(wrap);

  function toast(msg){
    const t=$('#toast');t.textContent=msg;t.classList.add('show');
    clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1100);
  }

  async function requestMotion(){
    try{
      if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
        const res=await DeviceOrientationEvent.requestPermission();
        if(res!=='granted')throw new Error('denied');
      }
      if('DeviceOrientationEvent' in window){
        window.addEventListener('deviceorientation',e=>{
          // intentionally gentle
          tiltX=clamp((e.gamma||0)/16,-1,1);
        },{passive:true});
        motionEnabled=true;
        motionRequestBtn.textContent='Motion enabled ✓';
        toast('Motion enabled');
        return true;
      }
    }catch(e){}
    motionRequestBtn.textContent='Use touch controls';
    toast('Using touch controls');
    return false;
  }

  function haptic(ms=12){if(navigator.vibrate)navigator.vibrate(ms);}
  function blip(freq=440,dur=.05,type='square',gain=.02){
    if(!soundOn)return;
    try{
      audioCtx ||= new (AudioContext||webkitAudioContext)();
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type=type;o.frequency.value=freq;
      g.gain.setValueAtTime(gain,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
    }catch(e){}
  }

  const configs={
    racer:{
      title:'TILT RACER',
      sub:'Tilt gently · the road gets faster',
      intro:'Cruise. Tilt gently. You cannot fall off the road. Edge hits and silly road junk only slow you down. Drive clean and the whole world gradually speeds up.',
      tiny:'Phone tilt is easiest. Drag or ← → works too.'
    },
    balance:{
      title:'BALANCE',
      sub:'Tilt gently · get every blob home',
      intro:'Guide all sleepy blobs into mint beds. Nothing is timed. Smooth hands win. Touch-drag works as a fake tilt.',
      tiny:'Phone tilt is best. Arrow keys / drag work too.'
    }
  };

  document.querySelectorAll('.game-card').forEach(btn=>btn.onclick=()=>openGame(btn.dataset.game));
  $('#backBtn').onclick=backToMenu;$('#menuBtn').onclick=backToMenu;
  $('#playBtn').onclick=async()=>{
    if(!motionEnabled)await requestMotion();
    introOverlay.classList.add('hidden');
    startGame();
  };
  $('#againBtn').onclick=()=>{endOverlay.classList.add('hidden');startGame();};
  $('#motionBtn').onclick=requestMotion;motionRequestBtn.onclick=requestMotion;
  soundBtn.onclick=()=>{
    soundOn=!soundOn;soundBtn.textContent=soundOn?'♪':'×';
    if(!soundOn)stopMusic();else if(running&&current==='racer')startMusic();
    toast(soundOn?'Sound on':'Sound off');
  };

  function openGame(name){
    current=name;const c=configs[name];
    menu.style.display='none';gameEl.classList.add('active');
    hudTitle.textContent=c.title;hudSub.textContent=c.sub;introTitle.textContent=c.title;introText.textContent=c.intro;introTiny.textContent=c.tiny;
    scoreLabel.textContent=name==='racer'?'speed':'home';
    scoreEl.textContent=name==='racer'?'18':'0';
    introOverlay.classList.remove('hidden');endOverlay.classList.add('hidden');
    resize();stopGame();state=makeState(name);draw();
  }

  function backToMenu(){stopGame();gameEl.classList.remove('active');menu.style.display='';current=null;}
  function finish(title,text){
    running=false;cancelAnimationFrame(raf);stopMusic();
    endTitle.textContent=title;endText.textContent=text;endOverlay.classList.remove('hidden');haptic(24);
  }
  function startGame(){
    resize();state=makeState(current);running=true;last=performance.now();
    cancelAnimationFrame(raf);if(current==='racer'&&soundOn)startMusic();raf=requestAnimationFrame(loop);
  }
  function stopGame(){running=false;cancelAnimationFrame(raf);stopMusic();}

  window.addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft')keyX=-1;if(e.key==='ArrowRight')keyX=1;
    if(e.key==='ArrowUp')keyY=-1;if(e.key==='ArrowDown')keyY=1;
    if(e.key.startsWith('Arrow'))e.preventDefault();
  });
  window.addEventListener('keyup',e=>{
    if(['ArrowLeft','ArrowRight'].includes(e.key))keyX=0;
    if(['ArrowUp','ArrowDown'].includes(e.key))keyY=0;
  });

  wrap.addEventListener('pointerdown',e=>{
    dragging=true;wrap.setPointerCapture(e.pointerId);
    const r=wrap.getBoundingClientRect();
    pointer.sx=pointer.lastX=pointer.x=e.clientX-r.left;
    pointer.sy=pointer.lastY=pointer.y=e.clientY-r.top;
  });
  wrap.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const r=wrap.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top;
    if(current==='racer'){
      const dx=(pointer.x-pointer.lastX)/Math.max(1,W);
      state.playerX=clamp(state.playerX+dx*2.2,-1,1);
    }
    pointer.lastX=pointer.x;pointer.lastY=pointer.y;
  });
  wrap.addEventListener('pointerup',()=>dragging=false);
  wrap.addEventListener('pointercancel',()=>dragging=false);

  function controls(){
    let x=keyX,y=keyY;
    if(motionEnabled)x+=tiltX;
    if(dragging&&current==='balance'){
      x+=clamp((pointer.x-pointer.sx)/(W*.35),-1,1);
      y+=clamp((pointer.y-pointer.sy)/(H*.35),-1,1);
    }
    return{x:clamp(x,-1.15,1.15),y:clamp(y,-1.15,1.15)};
  }

  function makeState(type){
    if(type==='racer'){
      return{
        type,t:0,
        speed:.12, targetSpeed:.12, maxSpeed:1,
        playerX:0,steerVel:0,bumpCooldown:0,
        cleanTime:0,
        travel:0,            // single source of truth for ALL forward motion
        obstacleTimer:3.4,
        obstacles:[],
        sceneryTimer:.8,
        scenery:[]
      };
    }
    return{
      type,t:0,score:0,
      blobs:[
        {x:W*.25,y:H*.25,vx:0,vy:0,r:15,home:false},
        {x:W*.72,y:H*.33,vx:0,vy:0,r:15,home:false},
        {x:W*.48,y:H*.62,vx:0,vy:0,r:15,home:false}
      ],
      beds:[
        {x:W*.20,y:H*.78,r:24,filled:false},
        {x:W*.50,y:H*.18,r:24,filled:false},
        {x:W*.78,y:H*.72,r:24,filled:false}
      ],
      bumpers:[
        {x:W*.5,y:H*.44,r:28},
        {x:W*.31,y:H*.5,r:20},
        {x:W*.7,y:H*.52,r:18}
      ]
    };
  }

  function loop(now){
    const dt=Math.min(.03,(now-last)/1000||.016);last=now;
    update(dt);draw();
    if(running)raf=requestAnimationFrame(loop);
  }

  function update(dt){
    if(current==='racer')updateRacer(dt);
    else updateBalance(dt);
  }

  // ---------- RACER ----------
  function speed01(){return state.speed;}
  function worldRate(){return 0.115 + speed01()*.39;} // how quickly z approaches player

  function roadCenterAt(p){
    // curved road; curves drift slowly with distance
    const a=state.travel*.13;
    const curve=Math.sin(a+p*1.7)*.085 + Math.sin(a*.43+p*4.1)*.028;
    return W*(.5+curve*(1-p*.18));
  }
  function roadHalfAt(p){return lerp(W*.10,W*.47,Math.pow(p,.92));}
  function roadY(p){
    const horizon=H*.245;
    return horizon+(H-horizon)*Math.pow(p,1.52);
  }
  function projectX(x,p){return roadCenterAt(p)+x*roadHalfAt(p)*.76;}

  function spawnObstacle(){
    const kinds=['cone','puddle','crate','duck'];
    state.obstacles.push({
      lane:rnd(-.68,.68),
      z:1.0,
      kind:kinds[(Math.random()*kinds.length)|0],
      hit:false
    });
  }

  function spawnScenery(){
    state.scenery.push({
      side:Math.random()<.5?-1:1,
      z:1,
      kind:Math.random()<.62?'tree':'flower'
    });
  }

  function slowDown(mult){
    state.speed=Math.max(.08,state.speed*mult);
    state.cleanTime=0;
    state.bumpCooldown=.22;
    blip(95,.055,'square',.035);haptic(16);
  }

  function updateRacer(dt){
    state.t+=dt;
    const c=controls();

    // Super forgiving steering.
    state.steerVel=lerp(state.steerVel,c.x*.95,1-Math.pow(.003,dt));
    state.playerX += state.steerVel*dt*.75;

    if(state.playerX<-1){
      state.playerX=-1;
      if(state.bumpCooldown<=0)slowDown(.82);
    }else if(state.playerX>1){
      state.playerX=1;
      if(state.bumpCooldown<=0)slowDown(.82);
    }
    state.bumpCooldown=Math.max(0,state.bumpCooldown-dt);

    // Starts slow; meaningful visual acceleration over ~45 seconds.
    state.cleanTime+=dt;
    state.targetSpeed=clamp(.12 + state.cleanTime/46,.12,1);
    state.speed=lerp(state.speed,state.targetSpeed,1-Math.pow(.55,dt));

    // One shared travel value drives road + objects + scenery.
    state.travel += dt*(.35 + state.speed*2.0);
    const rate=worldRate();

    // Objects start sparse. Frequency increases gently with speed.
    state.obstacleTimer-=dt;
    if(state.obstacleTimer<=0){
      spawnObstacle();
      state.obstacleTimer=lerp(4.8,2.2,state.speed)*rnd(.85,1.15);
    }

    state.sceneryTimer-=dt;
    if(state.sceneryTimer<=0){
      spawnScenery();
      state.sceneryTimer=lerp(.95,.38,state.speed)*rnd(.85,1.15);
    }

    for(const o of state.obstacles){
      o.z-=dt*rate;
      const p=1-clamp(o.z,0,1);
      if(!o.hit && p>.77 && p<.98){
        if(Math.abs(o.lane-state.playerX)<.15){
          o.hit=true;
          slowDown(o.kind==='puddle'?.88:.68);
        }
      }
    }
    state.obstacles=state.obstacles.filter(o=>o.z>-0.04);

    for(const s of state.scenery)s.z-=dt*rate;
    state.scenery=state.scenery.filter(s=>s.z>-0.04);

    scoreEl.textContent=Math.round(18+state.speed*112);
  }

  function updateBalance(dt){
    state.t+=dt;const c=controls(),ax=c.x*420,ay=c.y*420+30;
    for(const b of state.blobs){
      if(b.home)continue;
      b.vx+=ax*dt;b.vy+=ay*dt;b.vx*=Math.pow(.15,dt);b.vy*=Math.pow(.15,dt);
      b.x+=b.vx*dt;b.y+=b.vy*dt;
      if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.35}
      if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.35}
      if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.35}
      if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.35}

      for(const q of state.bumpers){
        let dx=b.x-q.x,dy=b.y-q.y,d=Math.hypot(dx,dy)||1,min=b.r+q.r;
        if(d<min){
          dx/=d;dy/=d;b.x=q.x+dx*min;b.y=q.y+dy*min;
          const dot=b.vx*dx+b.vy*dy;
          if(dot<0){b.vx-=1.4*dot*dx;b.vy-=1.4*dot*dy}
        }
      }

      for(const bed of state.beds){
        if(bed.filled)continue;
        if(dist(b.x,b.y,bed.x,bed.y)<bed.r-2&&Math.hypot(b.vx,b.vy)<150){
          b.home=true;bed.filled=true;b.x=bed.x;b.y=bed.y;b.vx=b.vy=0;
          state.score++;scoreEl.textContent=state.score;blip(720,.08,'sine',.03);haptic(8);
        }
      }
    }
    if(state.score===state.blobs.length)finish('ALL TUCKED IN.','Three blobs. Three beds. No drama.');
  }

  // ---------- DRAW ----------
  function rr(x,y,w,h,r,fill){
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();
  }

  function drawFace(x,y,r,base='#f6f1e7'){
    ctx.fillStyle=base;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.fillStyle='#111';ctx.beginPath();ctx.arc(x-r*.28,y-r*.08,2.1,0,7);ctx.arc(x+r*.28,y-r*.08,2.1,0,7);ctx.fill();
    ctx.strokeStyle='#111';ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(x,y+r*.14,r*.26,.15*Math.PI,.85*Math.PI);ctx.stroke();
  }

  function draw(){if(current==='racer')drawRacer();else drawBalance();}

  function drawRacer(){
    // sky
    ctx.fillStyle='#65cbff';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#aeeaff';ctx.fillRect(0,H*.14,W,H*.17);
    ctx.fillStyle='#ffd95f';ctx.beginPath();ctx.arc(W*.82,H*.12,Math.min(W,H)*.068,0,7);ctx.fill();

    // cheap clouds: three only
    ctx.fillStyle='#eefaff';
    const cloudShift=(state.travel*5)%W;
    const cloudXs=[W*.18-cloudShift*.10,W*.56-cloudShift*.06,W*.86-cloudShift*.08];
    for(let i=0;i<3;i++){
      let x=cloudXs[i];while(x<-80)x+=W+120;
      const y=H*(.08+.035*i);
      ctx.beginPath();ctx.arc(x,y,14,0,7);ctx.arc(x+17,y-4,20,0,7);ctx.arc(x+37,y,13,0,7);ctx.fill();
    }

    // hills
    ctx.fillStyle='#7bd671';
    ctx.beginPath();ctx.moveTo(0,H*.29);
    for(let x=0;x<=W;x+=70)ctx.lineTo(x,H*.275+Math.sin(x*.018+state.travel*.06)*15);
    ctx.lineTo(W,H*.40);ctx.lineTo(0,H*.40);ctx.closePath();ctx.fill();

    // road surface in ~26 strips, with moving band pattern tied to travel
    const steps=26;
    const phase=(state.travel*.72)%1;
    for(let i=0;i<steps;i++){
      const a=(i+phase)/steps,b=(i+1+phase)/steps;
      let p0=a%1,p1=b%1;
      if(p1<p0)continue;
      const y0=roadY(p0),y1=roadY(p1),c0=roadCenterAt(p0),c1=roadCenterAt(p1),h0=roadHalfAt(p0),h1=roadHalfAt(p1);
      const band=((i+Math.floor(state.travel*3))&1)===0;

      ctx.fillStyle=band?'#81df73':'#8be978';ctx.fillRect(0,y0,W,y1-y0+2);

      // curbs
      ctx.beginPath();ctx.moveTo(c0-h0*1.075,y0);ctx.lineTo(c1-h1*1.075,y1);ctx.lineTo(c1-h1,y1);ctx.lineTo(c0-h0,y0);ctx.closePath();
      ctx.fillStyle=band?'#fff5e8':'#ff655c';ctx.fill();

      ctx.beginPath();ctx.moveTo(c0+h0,y0);ctx.lineTo(c1+h1,y1);ctx.lineTo(c1+h1*1.075,y1);ctx.lineTo(c0+h0*1.075,y0);ctx.closePath();
      ctx.fillStyle=band?'#fff5e8':'#ff655c';ctx.fill();

      // asphalt
      ctx.beginPath();ctx.moveTo(c0-h0,y0);ctx.lineTo(c1-h1,y1);ctx.lineTo(c1+h1,y1);ctx.lineTo(c0+h0,y0);ctx.closePath();
      ctx.fillStyle=band?'#59616e':'#515966';ctx.fill();
    }

    // moving centre dashes — much clearer motion cue
    const dashCount=10;
    for(let i=0;i<dashCount;i++){
      const cyc=(i/dashCount + (state.travel*.22))%1;
      const p=cyc;
      if(p<.04)continue;
      const p2=Math.min(1,p+.045+.02*p);
      const y0=roadY(p),y1=roadY(p2),c0=roadCenterAt(p),c1=roadCenterAt(p2);
      const w0=Math.max(1,roadHalfAt(p)*.022),w1=Math.max(1,roadHalfAt(p2)*.022);
      ctx.beginPath();ctx.moveTo(c0-w0,y0);ctx.lineTo(c1-w1,y1);ctx.lineTo(c1+w1,y1);ctx.lineTo(c0+w0,y0);ctx.closePath();
      ctx.fillStyle='#fff8dc';ctx.fill();
    }

    // scenery
    for(const s of state.scenery){
      const p=1-clamp(s.z,0,1);if(p<=0)continue;
      const y=roadY(p),half=roadHalfAt(p),x=roadCenterAt(p)+s.side*half*1.22,sc=.18+p*.92;
      if(s.kind==='tree'){
        rr(x-4*sc,y-24*sc,8*sc,26*sc,3*sc,'#8b5c3d');
        ctx.fillStyle='#2dc46f';ctx.beginPath();ctx.arc(x,y-33*sc,18*sc,0,7);ctx.fill();
        ctx.fillStyle='#53df7e';ctx.beginPath();ctx.arc(x-7*sc,y-39*sc,10*sc,0,7);ctx.fill();
      }else{
        ctx.fillStyle='#ff5f91';ctx.beginPath();ctx.arc(x,y-4*sc,5*sc,0,7);ctx.fill();
        ctx.fillStyle='#ffd95f';ctx.beginPath();ctx.arc(x,y-4*sc,2*sc,0,7);ctx.fill();
      }
    }

    // obstacles use exact same z/projection as road speed
    const obs=[...state.obstacles].sort((a,b)=>b.z-a.z);
    for(const o of obs){
      const p=1-clamp(o.z,0,1);if(p<=0)continue;
      const y=roadY(p),x=projectX(o.lane,p),sc=.18+p*1.12;
      ctx.save();ctx.translate(x,y);if(o.hit){ctx.globalAlpha=.42;ctx.rotate(.45);}
      if(o.kind==='cone'){
        ctx.fillStyle='#ff8b3d';ctx.beginPath();ctx.moveTo(0,-22*sc);ctx.lineTo(-11*sc,7*sc);ctx.lineTo(11*sc,7*sc);ctx.closePath();ctx.fill();
        rr(-14*sc,6*sc,28*sc,5*sc,2*sc,'#fff5e8');
      }else if(o.kind==='crate'){
        rr(-14*sc,-14*sc,28*sc,28*sc,7*sc,'#a96a42');
        ctx.strokeStyle='#7c4b30';ctx.lineWidth=2.5*sc;ctx.beginPath();ctx.moveTo(-9*sc,-9*sc);ctx.lineTo(9*sc,9*sc);ctx.moveTo(9*sc,-9*sc);ctx.lineTo(-9*sc,9*sc);ctx.stroke();
      }else if(o.kind==='puddle'){
        ctx.fillStyle='#3f91dc';ctx.beginPath();ctx.ellipse(0,3*sc,23*sc,9*sc,0,0,7);ctx.fill();
      }else{
        ctx.fillStyle='#ffd84d';ctx.beginPath();ctx.arc(0,-3*sc,12*sc,0,7);ctx.fill();
        ctx.beginPath();ctx.arc(7*sc,-13*sc,7*sc,0,7);ctx.fill();
        ctx.fillStyle='#ff8b3d';ctx.beginPath();ctx.moveTo(13*sc,-14*sc);ctx.lineTo(20*sc,-11*sc);ctx.lineTo(13*sc,-9*sc);ctx.closePath();ctx.fill();
        ctx.fillStyle='#182034';ctx.beginPath();ctx.arc(9*sc,-15*sc,1.3*sc,0,7);ctx.fill();
      }
      ctx.restore();
    }

    // kart: about 20% of width
    const p=.88,px=roadCenterAt(p)+state.playerX*roadHalfAt(p)*.76,py=roadY(p);
    const base=Math.min(W*.205,H*.185),sc=base/120;
    ctx.save();ctx.translate(px,py);ctx.rotate(-state.steerVel*.07);

    ctx.fillStyle='rgba(24,32,52,.16)';ctx.beginPath();ctx.ellipse(0,40*sc,50*sc,14*sc,0,0,7);ctx.fill();
    rr(-50*sc,17*sc,18*sc,34*sc,9*sc,'#263044');rr(32*sc,17*sc,18*sc,34*sc,9*sc,'#263044');
    rr(-44*sc,-4*sc,88*sc,47*sc,21*sc,'#ff5f91');
    rr(-33*sc,9*sc,66*sc,28*sc,14*sc,'#9b7cff');
    rr(-48*sc,34*sc,96*sc,9*sc,5*sc,'#ffd95f');
    rr(-20*sc,-38*sc,40*sc,38*sc,16*sc,'#68e1bd');
    ctx.fillStyle='#ffd4a3';ctx.beginPath();ctx.arc(0,-52*sc,24*sc,0,7);ctx.fill();

    // floppy cartoon hat
    ctx.fillStyle='#ff9b3d';ctx.beginPath();ctx.ellipse(0,-70*sc,33*sc,10*sc,-.1,0,7);ctx.fill();
    ctx.beginPath();ctx.moveTo(-8*sc,-77*sc);ctx.quadraticCurveTo(7*sc,-106*sc,29*sc,-88*sc);ctx.quadraticCurveTo(12*sc,-84*sc,4*sc,-74*sc);ctx.closePath();ctx.fill();
    ctx.fillStyle='#fff7df';ctx.beginPath();ctx.arc(29*sc,-88*sc,6*sc,0,7);ctx.fill();

    ctx.fillStyle='#182034';ctx.beginPath();ctx.arc(-8*sc,-55*sc,2.5*sc,0,7);ctx.arc(8*sc,-55*sc,2.5*sc,0,7);ctx.fill();
    ctx.strokeStyle='#182034';ctx.lineWidth=2*sc;ctx.beginPath();ctx.arc(0,-47*sc,8*sc,.15*Math.PI,.85*Math.PI);ctx.stroke();
    ctx.restore();

    // speed streaks appear only at real high speed
    if(state.speed>.68){
      ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=2;
      const n=Math.floor((state.speed-.65)*18);
      for(let i=0;i<n;i++){
        const x=(i*83+state.travel*52)%W;
        const y=H*.53+((i*47)%Math.max(1,H*.40));
        ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+10+state.speed*12);ctx.stroke();
      }
    }
  }

  function drawBalance(){
    ctx.fillStyle='#10141a';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(103,224,192,.04)';
    for(let y=18;y<H;y+=32)for(let x=18;x<W;x+=32){ctx.beginPath();ctx.arc(x,y,1.2,0,7);ctx.fill();}

    for(const bed of state.beds){
      ctx.fillStyle=bed.filled?'rgba(103,224,192,.35)':'rgba(103,224,192,.14)';
      ctx.beginPath();ctx.arc(bed.x,bed.y,bed.r+5,0,7);ctx.fill();
      ctx.strokeStyle='#67e0c0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bed.x,bed.y,bed.r,0,7);ctx.stroke();
    }

    for(const q of state.bumpers){
      ctx.fillStyle='#2a313c';ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();
      ctx.strokeStyle='#3b4654';ctx.lineWidth=2;ctx.stroke();
    }

    for(const b of state.blobs){
      drawFace(b.x,b.y,b.r,b.home?'#67e0c0':'#f5f0e7');
      if(!b.home){
        ctx.strokeStyle='#111';ctx.lineWidth=1.5;ctx.beginPath();
        ctx.moveTo(b.x-7,b.y-2);ctx.lineTo(b.x-2,b.y-2);
        ctx.moveTo(b.x+2,b.y-2);ctx.lineTo(b.x+7,b.y-2);ctx.stroke();
      }
    }
  }

  // Tiny procedural chiptune; tempo follows the same speed value as the road.
  const melody=[0,4,7,9,7,4,2,4,0,4,7,11,9,7,4,2],bass=[0,0,-5,-5,-3,-3,-7,-7];
  function noteFreq(semi,oct=0){return 261.63*Math.pow(2,(semi+oct*12)/12);}
  function musicTick(){
    if(!soundOn||!running||current!=='racer'){musicTimer=null;return;}
    const bpm=82+state.speed*96;
    const beat=60000/bpm/2;
    blip(noteFreq(melody[musicStep%melody.length],1),Math.min(.075,beat/1000*.55),'square',.015);
    if(musicStep%2===0)blip(noteFreq(bass[(musicStep/2)%bass.length|0],-1),Math.min(.10,beat/1000*.68),'triangle',.020);
    musicStep++;musicTimer=setTimeout(musicTick,beat);
  }
  function startMusic(){
    stopMusic();musicStep=0;
    try{
      audioCtx ||= new (AudioContext||webkitAudioContext)();
      if(audioCtx.state==='suspended')audioCtx.resume();
    }catch(e){}
    musicTick();
  }
  function stopMusic(){if(musicTimer){clearTimeout(musicTimer);musicTimer=null;}}

  if('serviceWorker' in navigator){
    window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
  }
})();
</script>
</body>
</html>
